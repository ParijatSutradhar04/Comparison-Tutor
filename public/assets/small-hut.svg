<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Small Hut -->
  <rect width="200" height="200" fill="#e0f2fe"/>
  
  <!-- Ground -->
  <rect x="0" y="170" width="200" height="30" fill="#84cc16"/>
  
  <!-- Hut Base - smaller and rounder -->
  <ellipse cx="100" cy="140" rx="45" ry="30" fill="#d97706" stroke="#c2410c" stroke-width="2"/>
  
  <!-- Thatched Roof -->
  <ellipse cx="100" cy="100" rx="55" ry="35" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
  
  <!-- Thatch texture -->
  <g stroke="#d97706" stroke-width="1" fill="none">
    <path d="M60 85 Q80 80 100 85 Q120 80 140 85"/>
    <path d="M55 95 Q75 90 95 95 Q115 90 135 95"/>
    <path d="M50 105 Q70 100 90 105 Q110 100 130 105"/>
    <path d="M55 115 Q75 110 95 115 Q115 110 135 115"/>
  </g>
  
  <!-- Small Door -->
  <ellipse cx="100" cy="150" rx="10" ry="15" fill="#78350f" stroke="#65281c" stroke-width="1"/>
  
  <!-- Small Window -->
  <circle cx="80" cy="130" r="6" fill="#374151" stroke="#1f2937" stroke-width="1"/>
  
  <!-- Support Poles -->
  <rect x="70" y="120" width="3" height="50" fill="#78350f"/>
  <rect x="127" y="120" width="3" height="50" fill="#78350f"/>
  
  <!-- Label -->
  <text x="100" y="195" text-anchor="middle" fill="#4a5568" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Small Hut</text>
</svg>
