<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Water Buffalo - Large Farm Animal -->
  <rect width="200" height="200" fill="#f8fafc"/>
  
  <!-- Buffalo Body -->
  <ellipse cx="100" cy="130" rx="70" ry="35" fill="#2d3748" stroke="#1a202c" stroke-width="2"/>
  
  <!-- Buffalo Head -->
  <ellipse cx="50" cy="90" rx="35" ry="25" fill="#2d3748" stroke="#1a202c" stroke-width="2"/>
  
  <!-- Horns -->
  <path d="M25 75 Q15 65 10 55" stroke="#1a202c" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M75 75 Q85 65 90 55" stroke="#1a202c" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Eyes -->
  <circle cx="40" cy="85" r="3" fill="white"/>
  <circle cx="60" cy="85" r="3" fill="white"/>
  <circle cx="40" cy="85" r="2" fill="black"/>
  <circle cx="60" cy="85" r="2" fill="black"/>
  
  <!-- Legs -->
  <rect x="45" y="150" width="8" height="30" fill="#2d3748"/>
  <rect x="65" y="150" width="8" height="30" fill="#2d3748"/>
  <rect x="120" y="150" width="8" height="30" fill="#2d3748"/>
  <rect x="140" y="150" width="8" height="30" fill="#2d3748"/>
  
  <!-- Tail -->
  <path d="M170 140 Q185 145 190 160" stroke="#2d3748" stroke-width="6" fill="none" stroke-linecap="round"/>
  
  <!-- Label -->
  <text x="100" y="190" text-anchor="middle" fill="#4a5568" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Water Buffalo</text>
</svg>
