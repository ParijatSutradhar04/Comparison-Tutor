<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Rain Puddle -->
  <rect width="200" height="200" fill="#f8fafc"/>
  
  <!-- Small puddle -->
  <ellipse cx="100" cy="140" rx="25" ry="8" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1" opacity="0.7"/>
  
  <!-- Water reflection -->
  <ellipse cx="95" cy="138" rx="8" ry="3" fill="#93c5fd" opacity="0.5"/>
  
  <!-- Wet ground around puddle -->
  <ellipse cx="100" cy="140" rx="35" ry="12" fill="#64748b" opacity="0.3"/>
  
  <!-- Rain drops -->
  <g fill="#3b82f6" opacity="0.6">
    <ellipse cx="80" cy="120" rx="1" ry="3"/>
    <ellipse cx="120" cy="110" rx="1" ry="3"/>
    <ellipse cx="90" cy="100" rx="1" ry="3"/>
    <ellipse cx="130" cy="125" rx="1" ry="3"/>
    <ellipse cx="70" cy="130" rx="1" ry="3"/>
    <ellipse cx="140" cy="115" rx="1" ry="3"/>
  </g>
  
  <!-- Splash effects -->
  <g stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.4">
    <circle cx="85" cy="140" r="2"/>
    <circle cx="110" cy="138" r="1.5"/>
    <circle cx="95" cy="142" r="1"/>
  </g>
  
  <!-- Small stones/debris -->
  <g fill="#6b7280" opacity="0.6">
    <ellipse cx="75" cy="145" rx="2" ry="1"/>
    <ellipse cx="125" cy="143" rx="1.5" ry="1"/>
    <ellipse cx="105" cy="148" rx="1" ry="0.5"/>
  </g>
  
  <!-- Ground -->
  <rect x="0" y="160" width="200" height="40" fill="#84cc16"/>
  
  <!-- Label -->
  <text x="100" y="185" text-anchor="middle" fill="#4a5568" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Small Rain Puddle</text>
</svg>
