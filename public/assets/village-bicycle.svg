<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Village Bicycle -->
  <rect width="200" height="200" fill="#f8fafc"/>
  
  <!-- Bicycle Frame -->
  <g stroke="#374151" stroke-width="3" fill="none">
    <!-- Main triangle -->
    <path d="M70 120 L120 120 L100 90 Z"/>
    <!-- Seat post -->
    <path d="M90 90 L90 80"/>
    <!-- Handle bar post -->
    <path d="M100 90 L105 75"/>
  </g>
  
  <!-- Wheels -->
  <circle cx="70" cy="140" r="25" fill="none" stroke="#374151" stroke-width="3"/>
  <circle cx="130" cy="140" r="25" fill="none" stroke="#374151" stroke-width="3"/>
  
  <!-- Wheel spokes -->
  <g stroke="#6b7280" stroke-width="1">
    <!-- Front wheel spokes -->
    <path d="M45 140 L95 140"/>
    <path d="M70 115 L70 165"/>
    <path d="M52 122 L88 158"/>
    <path d="M52 158 L88 122"/>
    
    <!-- Rear wheel spokes -->
    <path d="M105 140 L155 140"/>
    <path d="M130 115 L130 165"/>
    <path d="M112 122 L148 158"/>
    <path d="M112 158 L148 122"/>
  </g>
  
  <!-- Seat -->
  <ellipse cx="90" cy="80" rx="10" ry="3" fill="#1f2937" stroke="#111827" stroke-width="1"/>
  
  <!-- Handle bars -->
  <path d="M95 75 L115 75" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Pedals -->
  <circle cx="100" cy="120" r="3" fill="#6b7280" stroke="#4b5563" stroke-width="1"/>
  <ellipse cx="95" cy="125" rx="4" ry="2" fill="#1f2937"/>
  <ellipse cx="105" cy="115" rx="4" ry="2" fill="#1f2937"/>
  
  <!-- Chain -->
  <ellipse cx="100" cy="120" rx="15" ry="8" fill="none" stroke="#9ca3af" stroke-width="1"/>
  
  <!-- Ground -->
  <rect x="0" y="180" width="200" height="20" fill="#84cc16"/>
  
  <!-- Label -->
  <text x="100" y="195" text-anchor="middle" fill="#4a5568" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Village Bicycle</text>
</svg>
