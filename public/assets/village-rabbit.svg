<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Village Rabbit -->
  <rect width="200" height="200" fill="#f8fafc"/>
  
  <!-- Rabbit Body -->
  <ellipse cx="110" cy="130" rx="25" ry="15" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
  
  <!-- Rabbit Head -->
  <ellipse cx="85" cy="115" rx="18" ry="15" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
  
  <!-- Long Ears -->
  <ellipse cx="78" cy="95" rx="5" ry="15" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
  <ellipse cx="92" cy="95" rx="5" ry="15" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
  
  <!-- Inner ears -->
  <ellipse cx="78" cy="95" rx="3" ry="10" fill="#fecaca"/>
  <ellipse cx="92" cy="95" rx="3" ry="10" fill="#fecaca"/>
  
  <!-- Eyes -->
  <circle cx="80" cy="112" r="3" fill="black"/>
  <circle cx="90" cy="112" r="3" fill="black"/>
  <circle cx="81" cy="111" r="1" fill="white"/>
  <circle cx="91" cy="111" r="1" fill="white"/>
  
  <!-- Nose -->
  <ellipse cx="85" cy="120" rx="2" ry="1" fill="#f87171"/>
  
  <!-- Whiskers -->
  <path d="M70 115 L60 113" stroke="#6b7280" stroke-width="1"/>
  <path d="M70 118 L60 118" stroke="#6b7280" stroke-width="1"/>
  <path d="M100 115 L110 113" stroke="#6b7280" stroke-width="1"/>
  <path d="M100 118 L110 118" stroke="#6b7280" stroke-width="1"/>
  
  <!-- Legs -->
  <ellipse cx="95" cy="145" rx="4" ry="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <ellipse cx="105" cy="145" rx="4" ry="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <ellipse cx="120" cy="145" rx="4" ry="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <ellipse cx="130" cy="145" rx="4" ry="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  
  <!-- Cotton tail -->
  <circle cx="135" cy="125" r="6" fill="white" stroke="#d1d5db" stroke-width="1"/>
  
  <!-- Ground -->
  <rect x="0" y="170" width="200" height="30" fill="#84cc16"/>
  
  <!-- Label -->
  <text x="100" y="195" text-anchor="middle" fill="#4a5568" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Village Rabbit</text>
</svg>
