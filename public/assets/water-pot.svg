<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Water Pot -->
  <rect width="200" height="200" fill="#f8fafc"/>
  
  <!-- Pot Base -->
  <ellipse cx="100" cy="150" rx="35" ry="8" fill="#dc2626" opacity="0.3"/>
  
  <!-- Pot Body -->
  <path d="M75 150 Q70 130 75 110 Q80 90 85 80 L115 80 Q120 90 125 110 Q130 130 125 150 Z" 
        fill="#dc2626" stroke="#b91c1c" stroke-width="2"/>
  
  <!-- Pot Neck -->
  <rect x="90" y="70" width="20" height="15" fill="#dc2626" stroke="#b91c1c" stroke-width="2"/>
  
  <!-- Pot Rim -->
  <ellipse cx="100" cy="70" rx="12" ry="3" fill="#b91c1c" stroke="#991b1b" stroke-width="1"/>
  
  <!-- Traditional patterns -->
  <g stroke="#991b1b" stroke-width="1.5" fill="none">
    <path d="M80 100 Q90 95 100 100 Q110 95 120 100"/>
    <path d="M80 120 Q90 115 100 120 Q110 115 120 120"/>
    <path d="M80 140 Q90 135 100 140 Q110 135 120 140"/>
  </g>
  
  <!-- Small handles -->
  <circle cx="75" cy="110" r="4" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <circle cx="125" cy="110" r="4" fill="none" stroke="#b91c1c" stroke-width="2"/>
  
  <!-- Water inside (visible through opening) -->
  <ellipse cx="100" cy="75" rx="8" ry="2" fill="#3b82f6" opacity="0.6"/>
  
  <!-- Label -->
  <text x="100" y="180" text-anchor="middle" fill="#4a5568" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Water Pot</text>
</svg>
