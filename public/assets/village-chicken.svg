<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Village Chicken - Small Farm Animal -->
  <rect width="200" height="200" fill="#f8fafc"/>
  
  <!-- Chicken Body -->
  <ellipse cx="100" cy="130" rx="40" ry="25" fill="#dc2626" stroke="#b91c1c" stroke-width="2"/>
  
  <!-- Chicken Head -->
  <circle cx="70" cy="100" r="20" fill="#dc2626" stroke="#b91c1c" stroke-width="2"/>
  
  <!-- Beak -->
  <path d="M50 100 L40 105 L50 110 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
  
  <!-- Eye -->
  <circle cx="65" cy="95" r="3" fill="white"/>
  <circle cx="65" cy="95" r="2" fill="black"/>
  
  <!-- Comb -->
  <path d="M60 80 Q65 75 70 80 Q75 75 80 80 Q85 75 90 80" stroke="#dc2626" stroke-width="3" fill="#dc2626"/>
  
  <!-- Wings -->
  <ellipse cx="110" cy="120" rx="25" ry="15" fill="#b91c1c" stroke="#991b1b" stroke-width="1"/>
  
  <!-- Legs -->
  <path d="M85 150 L85 170 M80 170 L90 170 M85 165 L75 175" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M115 150 L115 170 M110 170 L120 170 M115 165 L105 175" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Tail Feathers -->
  <path d="M140 130 Q155 125 160 140 Q155 145 140 135" fill="#b91c1c" stroke="#991b1b" stroke-width="1"/>
  
  <!-- Label -->
  <text x="100" y="190" text-anchor="middle" fill="#4a5568" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Village Chicken</text>
</svg>
