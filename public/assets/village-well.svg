<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Village Well -->
  <rect width="200" height="200" fill="#e0f2fe"/>
  
  <!-- Well Structure - Large stone circle -->
  <circle cx="100" cy="120" r="60" fill="#64748b" stroke="#475569" stroke-width="4"/>
  <circle cx="100" cy="120" r="45" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Stone texture -->
  <g stroke="#94a3b8" stroke-width="1" fill="none">
    <path d="M50 90 Q70 85 90 90"/>
    <path d="M110 90 Q130 85 150 90"/>
    <path d="M45 120 Q65 115 85 120"/>
    <path d="M115 120 Q135 115 155 120"/>
    <path d="M50 150 Q70 145 90 150"/>
    <path d="M110 150 Q130 145 150 150"/>
  </g>
  
  <!-- Pulley System -->
  <rect x="90" y="30" width="20" height="8" fill="#78350f"/>
  <circle cx="100" cy="38" r="8" fill="#475569" stroke="#374151" stroke-width="2"/>
  <rect x="98" y="46" width="4" height="40" fill="#78350f"/>
  
  <!-- Rope -->
  <path d="M100 46 Q105 60 100 75 Q95 85 100 95" stroke="#78350f" stroke-width="3" fill="none"/>
  
  <!-- Water bucket -->
  <ellipse cx="100" cy="100" rx="8" ry="6" fill="#6b7280" stroke="#4b5563" stroke-width="1"/>
  <rect x="92" y="95" width="16" height="10" fill="#6b7280" stroke="#4b5563" stroke-width="1"/>
  
  <!-- Ground -->
  <rect x="0" y="180" width="200" height="20" fill="#84cc16"/>
  
  <!-- Label -->
  <text x="100" y="195" text-anchor="middle" fill="#4a5568" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Village Well</text>
</svg>
