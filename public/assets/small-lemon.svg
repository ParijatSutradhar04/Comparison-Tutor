<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Small lemon -->
  <rect width="200" height="200" fill="#87CEEB"/>
  <!-- Lemon shape -->
  <ellipse cx="100" cy="100" rx="15" ry="20" fill="#FFFF00"/>
  <!-- Highlight -->
  <ellipse cx="95" cy="90" rx="4" ry="6" fill="#FFFACD" opacity="0.8"/>
  <!-- Dimpled texture -->
  <circle cx="90" cy="105" r="1" fill="#F0E68C"/>
  <circle cx="110" cy="95" r="1" fill="#F0E68C"/>
  <circle cx="105" cy="110" r="1" fill="#F0E68C"/>
  <!-- Stem -->
  <rect x="99" y="80" width="2" height="5" fill="#228B22"/>
  <text x="100" y="180" text-anchor="middle" fill="#000" font-size="12">Small Lemon</text>
</svg>
