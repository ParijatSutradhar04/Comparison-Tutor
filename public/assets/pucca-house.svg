<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Pucca House -->
  <rect width="200" height="200" fill="#e0f2fe"/>
  
  <!-- Ground -->
  <rect x="0" y="170" width="200" height="30" fill="#84cc16"/>
  
  <!-- House Base -->
  <rect x="30" y="100" width="140" height="70" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
  
  <!-- Roof -->
  <path d="M20 100 L100 50 L180 100 Z" fill="#dc2626" stroke="#b91c1c" stroke-width="2"/>
  
  <!-- Door -->
  <rect x="85" y="130" width="30" height="40" fill="#78350f" stroke="#65281c" stroke-width="2"/>
  <circle cx="108" cy="150" r="2" fill="#fbbf24"/>
  
  <!-- Windows -->
  <rect x="50" y="120" width="20" height="20" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="130" y="120" width="20" height="20" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  
  <!-- Window frames -->
  <path d="M60 120 L60 140 M50 130 L70 130" stroke="#1d4ed8" stroke-width="1"/>
  <path d="M140 120 L140 140 M130 130 L150 130" stroke="#1d4ed8" stroke-width="1"/>
  
  <!-- Chimney -->
  <rect x="145" y="60" width="15" height="30" fill="#6b7280" stroke="#4b5563" stroke-width="2"/>
  
  <!-- Smoke -->
  <g fill="#9ca3af" opacity="0.6">
    <circle cx="150" cy="55" r="3"/>
    <circle cx="155" cy="50" r="2"/>
    <circle cx="148" cy="45" r="2"/>
  </g>
  
  <!-- Label -->
  <text x="100" y="195" text-anchor="middle" fill="#4a5568" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Pucca House</text>
</svg>
