<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Large Old Banyan Tree -->
  <rect width="200" height="200" fill="#e0f2fe"/>
  
  <!-- Main Trunk -->
  <rect x="85" y="100" width="30" height="80" fill="#78350f" stroke="#65281c" stroke-width="2"/>
  
  <!-- Aerial Roots -->
  <rect x="60" y="120" width="4" height="60" fill="#78350f"/>
  <rect x="70" y="110" width="4" height="70" fill="#78350f"/>
  <rect x="125" y="115" width="4" height="65" fill="#78350f"/>
  <rect x="135" y="125" width="4" height="55" fill="#78350f"/>
  
  <!-- Large Canopy -->
  <ellipse cx="100" cy="80" rx="80" ry="40" fill="#15803d" opacity="0.9"/>
  <ellipse cx="70" cy="90" rx="50" ry="25" fill="#16a34a" opacity="0.8"/>
  <ellipse cx="130" cy="85" rx="45" ry="30" fill="#16a34a" opacity="0.8"/>
  <ellipse cx="100" cy="65" rx="60" ry="25" fill="#22c55e" opacity="0.7"/>
  
  <!-- Ground -->
  <rect x="0" y="180" width="200" height="20" fill="#84cc16"/>
  
  <!-- Label -->
  <text x="100" y="195" text-anchor="middle" fill="#4a5568" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Old Banyan Tree</text>
</svg>
