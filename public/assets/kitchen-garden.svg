<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Kitchen Garden -->
  <rect width="200" height="200" fill="#f8fafc"/>
  
  <!-- Small garden plot -->
  <rect x="60" y="120" width="80" height="50" fill="#84cc16" stroke="#65a30d" stroke-width="2"/>
  
  <!-- Small vegetable rows -->
  <g stroke="#16a34a" stroke-width="1.5" fill="#22c55e" opacity="0.8">
    <!-- Row 1 - Leafy vegetables -->
    <path d="M65 130 L70 125 L75 130 L80 125 L85 130 L90 125 L95 130 L100 125 L105 130 L110 125 L115 130 L120 125 L125 130 L130 125 L135 130"/>
    
    <!-- Row 2 - Different vegetables -->
    <path d="M65 145 L70 140 L75 145 L80 140 L85 145 L90 140 L95 145 L100 140 L105 145 L110 140 L115 145 L120 140 L125 145 L130 140 L135 145"/>
    
    <!-- Row 3 - Small plants -->
    <path d="M65 160 L70 155 L75 160 L80 155 L85 160 L90 155 L95 160 L100 155 L105 160 L110 155 L115 160 L120 155 L125 160 L130 155 L135 160"/>
  </g>
  
  <!-- Small tomato plants -->
  <g fill="#dc2626" opacity="0.7">
    <circle cx="75" cy="135" r="2"/>
    <circle cx="95" cy="140" r="2"/>
    <circle cx="115" cy="132" r="2"/>
  </g>
  
  <!-- Small fence around garden -->
  <g stroke="#78350f" stroke-width="2" fill="none">
    <rect x="55" y="115" width="90" height="60"/>
    <!-- Fence posts -->
    <path d="M55 115 L55 105"/>
    <path d="M100 115 L100 105"/>
    <path d="M145 115 L145 105"/>
    <path d="M55 175 L55 185"/>
    <path d="M100 175 L100 185"/>
    <path d="M145 175 L145 185"/>
  </g>
  
  <!-- Small watering can -->
  <ellipse cx="150" cy="140" rx="6" ry="4" fill="#6b7280" stroke="#4b5563" stroke-width="1"/>
  <rect x="148" y="138" width="4" height="8" fill="#6b7280"/>
  <path d="M156 140 Q162 138 165 142" stroke="#4b5563" stroke-width="2" fill="none"/>
  
  <!-- Small tools -->
  <path d="M50 160 L45 165 L50 170" stroke="#78350f" stroke-width="2" fill="none"/>
  <rect x="49" y="170" width="2" height="8" fill="#78350f"/>
  
  <!-- Ground -->
  <rect x="0" y="185" width="200" height="15" fill="#84cc16"/>
  
  <!-- Label -->
  <text x="100" y="198" text-anchor="middle" fill="#4a5568" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Small Kitchen Garden</text>
</svg>
