<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Elephant - very large -->
  <rect width="200" height="200" fill="#87CEEB"/>
  <!-- Body -->
  <ellipse cx="120" cy="130" rx="70" ry="40" fill="#808080"/>
  <!-- Head -->
  <ellipse cx="70" cy="100" rx="35" ry="30" fill="#808080"/>
  <!-- Trunk -->
  <path d="M35 110 Q20 130 30 150 Q40 160 50 150" stroke="#808080" stroke-width="15" fill="none"/>
  <!-- Legs -->
  <rect x="80" y="160" width="15" height="30" fill="#808080"/>
  <rect x="100" y="160" width="15" height="30" fill="#808080"/>
  <rect x="130" y="160" width="15" height="30" fill="#808080"/>
  <rect x="150" y="160" width="15" height="30" fill="#808080"/>
  <!-- Ears -->
  <ellipse cx="55" cy="85" rx="20" ry="25" fill="#696969"/>
  <ellipse cx="85" cy="85" rx="20" ry="25" fill="#696969"/>
  <!-- Tail -->
  <path d="M190 140 Q200 150 195 160" stroke="#808080" stroke-width="8" fill="none"/>
  <!-- Tusks -->
  <rect x="28" y="115" width="4" height="15" fill="#FFFACD"/>
  <rect x="38" y="115" width="4" height="15" fill="#FFFACD"/>
  <text x="100" y="190" text-anchor="middle" fill="#000" font-size="12">Very Large Elephant</text>
</svg>
