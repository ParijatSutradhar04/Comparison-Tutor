<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Desert Camel -->
  <rect width="200" height="200" fill="#fef3c7"/>
  
  <!-- Camel Body -->
  <ellipse cx="120" cy="130" rx="50" ry="20" fill="#d97706" stroke="#c2410c" stroke-width="2"/>
  
  <!-- Camel Humps -->
  <ellipse cx="110" cy="110" rx="15" ry="20" fill="#d97706" stroke="#c2410c" stroke-width="2"/>
  <ellipse cx="130" cy="105" rx="12" ry="18" fill="#d97706" stroke="#c2410c" stroke-width="2"/>
  
  <!-- Neck -->
  <ellipse cx="80" cy="115" rx="12" ry="25" fill="#d97706" stroke="#c2410c" stroke-width="2"/>
  
  <!-- Head -->
  <ellipse cx="70" cy="85" rx="15" ry="18" fill="#d97706" stroke="#c2410c" stroke-width="2"/>
  
  <!-- Ears -->
  <ellipse cx="65" cy="75" rx="4" ry="8" fill="#d97706" stroke="#c2410c" stroke-width="1"/>
  <ellipse cx="75" cy="75" rx="4" ry="8" fill="#d97706" stroke="#c2410c" stroke-width="1"/>
  
  <!-- Eyes -->
  <circle cx="67" cy="82" r="2" fill="white"/>
  <circle cx="67" cy="82" r="1.5" fill="black"/>
  
  <!-- Legs -->
  <rect x="95" y="145" width="6" height="25" fill="#d97706"/>
  <rect x="110" y="145" width="6" height="25" fill="#d97706"/>
  <rect x="135" y="145" width="6" height="25" fill="#d97706"/>
  <rect x="150" y="145" width="6" height="25" fill="#d97706"/>
  
  <!-- Tail -->
  <path d="M170 135 Q180 140 185 150" stroke="#d97706" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Desert background -->
  <ellipse cx="50" cy="180" rx="30" ry="8" fill="#fbbf24" opacity="0.5"/>
  <ellipse cx="150" cy="185" rx="25" ry="6" fill="#fbbf24" opacity="0.5"/>
  
  <!-- Label -->
  <text x="100" y="195" text-anchor="middle" fill="#4a5568" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Desert Camel</text>
</svg>
