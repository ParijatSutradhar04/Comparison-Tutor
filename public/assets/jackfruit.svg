<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Large Jackfruit -->
  <rect width="200" height="200" fill="#f8fafc"/>
  
  <!-- Jackfruit Body - Large oval -->
  <ellipse cx="100" cy="100" rx="50" ry="65" fill="#15803d" stroke="#166534" stroke-width="2"/>
  
  <!-- Spiky texture -->
  <g fill="#22c55e" opacity="0.8">
    <circle cx="75" cy="70" r="3"/>
    <circle cx="85" cy="60" r="3"/>
    <circle cx="100" cy="55" r="3"/>
    <circle cx="115" cy="60" r="3"/>
    <circle cx="125" cy="70" r="3"/>
    <circle cx="70" cy="90" r="3"/>
    <circle cx="90" cy="85" r="3"/>
    <circle cx="110" cy="85" r="3"/>
    <circle cx="130" cy="90" r="3"/>
    <circle cx="75" cy="110" r="3"/>
    <circle cx="95" cy="105" r="3"/>
    <circle cx="105" cy="105" r="3"/>
    <circle cx="125" cy="110" r="3"/>
    <circle cx="80" cy="130" r="3"/>
    <circle cx="100" cy="125" r="3"/>
    <circle cx="120" cy="130" r="3"/>
    <circle cx="85" cy="150" r="3"/>
    <circle cx="115" cy="150" r="3"/>
  </g>
  
  <!-- Stem -->
  <rect x="97" y="35" width="6" height="15" fill="#78350f"/>
  
  <!-- Label -->
  <text x="100" y="190" text-anchor="middle" fill="#4a5568" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Large Jackfruit</text>
</svg>
