<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Coconut -->
  <rect width="200" height="200" fill="#f8fafc"/>
  
  <!-- Coconut Main Body -->
  <ellipse cx="100" cy="110" rx="35" ry="45" fill="#78350f" stroke="#65281c" stroke-width="2"/>
  
  <!-- Coconut Husk Texture -->
  <g stroke="#92400e" stroke-width="1" fill="none">
    <path d="M75 80 Q85 75 95 80 Q105 75 115 80 Q125 75 135 80"/>
    <path d="M70 95 Q80 90 90 95 Q100 90 110 95 Q120 90 130 95"/>
    <path d="M75 110 Q85 105 95 110 Q105 105 115 110 Q125 105 135 110"/>
    <path d="M70 125 Q80 120 90 125 Q100 120 110 125 Q120 120 130 125"/>
    <path d="M75 140 Q85 135 95 140 Q105 135 115 140 Q125 135 135 140"/>
    <path d="M80 155 Q90 150 100 155 Q110 150 120 155"/>
  </g>
  
  <!-- Three eyes/holes at top -->
  <circle cx="90" cy="70" r="4" fill="#374151"/>
  <circle cx="100" cy="68" r="4" fill="#374151"/>
  <circle cx="110" cy="70" r="4" fill="#374151"/>
  
  <!-- Fibrous texture -->
  <g fill="#92400e" opacity="0.5">
    <rect x="85" y="85" width="1" height="8" transform="rotate(15 85 85)"/>
    <rect x="95" y="90" width="1" height="10" transform="rotate(-10 95 90)"/>
    <rect x="105" y="95" width="1" height="12" transform="rotate(20 105 95)"/>
    <rect x="115" y="100" width="1" height="8" transform="rotate(-15 115 100)"/>
    <rect x="85" y="120" width="1" height="10" transform="rotate(-20 85 120)"/>
    <rect x="115" y="130" width="1" height="12" transform="rotate(25 115 130)"/>
  </g>
  
  <!-- Label -->
  <text x="100" y="180" text-anchor="middle" fill="#4a5568" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Large Coconut</text>
</svg>
