<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="300" fill="#f0f9ff"/>
  <text x="150" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0369a1">5 Apples</text>
  
  <!-- Row 1 -->
  <circle cx="60" cy="80" r="25" fill="#ef4444" opacity="0.8"/>
  <circle cx="150" cy="80" r="25" fill="#ef4444" opacity="0.8"/>
  <circle cx="240" cy="80" r="25" fill="#ef4444" opacity="0.8"/>
  
  <!-- Row 2 -->
  <circle cx="105" cy="140" r="25" fill="#ef4444" opacity="0.8"/>
  <circle cx="195" cy="140" r="25" fill="#ef4444" opacity="0.8"/>
  
  <!-- Apple stems -->
  <line x1="60" y1="55" x2="60" y2="70" stroke="#22c55e" stroke-width="3"/>
  <line x1="150" y1="55" x2="150" y2="70" stroke="#22c55e" stroke-width="3"/>
  <line x1="240" y1="55" x2="240" y2="70" stroke="#22c55e" stroke-width="3"/>
  <line x1="105" y1="115" x2="105" y2="130" stroke="#22c55e" stroke-width="3"/>
  <line x1="195" y1="115" x2="195" y2="130" stroke="#22c55e" stroke-width="3"/>
  
  <text x="150" y="220" text-anchor="middle" font-size="16" fill="#6b7280">Count: 5</text>
  <text x="150" y="250" text-anchor="middle" font-size="14" fill="#9ca3af">Sample Asset</text>
