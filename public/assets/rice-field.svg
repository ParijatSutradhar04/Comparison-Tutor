<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Rice Field -->
  <rect width="200" height="200" fill="#e0f2fe"/>
  
  <!-- Large field area -->
  <rect x="10" y="100" width="180" height="80" fill="#84cc16" stroke="#65a30d" stroke-width="2"/>
  
  <!-- Water/mud areas between rice -->
  <g fill="#3b82f6" opacity="0.4">
    <rect x="15" y="105" width="170" height="3"/>
    <rect x="15" y="120" width="170" height="3"/>
    <rect x="15" y="135" width="170" height="3"/>
    <rect x="15" y="150" width="170" height="3"/>
    <rect x="15" y="165" width="170" height="3"/>
  </g>
  
  <!-- Rice plants rows -->
  <g stroke="#16a34a" stroke-width="2" fill="#22c55e" opacity="0.8">
    <!-- Row 1 -->
    <path d="M20 110 L25 105 L30 110 L35 105 L40 110 L45 105 L50 110 L55 105 L60 110 L65 105 L70 110 L75 105 L80 110 L85 105 L90 110 L95 105 L100 110 L105 105 L110 110 L115 105 L120 110 L125 105 L130 110 L135 105 L140 110 L145 105 L150 110 L155 105 L160 110 L165 105 L170 110 L175 105 L180 110"/>
    
    <!-- Row 2 -->
    <path d="M20 125 L25 120 L30 125 L35 120 L40 125 L45 120 L50 125 L55 120 L60 125 L65 120 L70 125 L75 120 L80 125 L85 120 L90 125 L95 120 L100 125 L105 120 L110 125 L115 120 L120 125 L125 120 L130 125 L135 120 L140 125 L145 120 L150 125 L155 120 L160 125 L165 120 L170 125 L175 120 L180 125"/>
    
    <!-- Row 3 -->
    <path d="M20 140 L25 135 L30 140 L35 135 L40 140 L45 135 L50 140 L55 135 L60 140 L65 135 L70 140 L75 135 L80 140 L85 135 L90 140 L95 135 L100 140 L105 135 L110 140 L115 135 L120 140 L125 135 L130 140 L135 135 L140 140 L145 135 L150 140 L155 135 L160 140 L165 135 L170 140 L175 135 L180 140"/>
    
    <!-- Row 4 -->
    <path d="M20 155 L25 150 L30 155 L35 150 L40 155 L45 150 L50 155 L55 150 L60 155 L65 150 L70 155 L75 150 L80 155 L85 150 L90 155 L95 150 L100 155 L105 150 L110 155 L115 150 L120 155 L125 150 L130 155 L135 150 L140 155 L145 150 L150 155 L155 150 L160 155 L165 150 L170 155 L175 150 L180 155"/>
    
    <!-- Row 5 -->
    <path d="M20 170 L25 165 L30 170 L35 165 L40 170 L45 165 L50 170 L55 165 L60 170 L65 165 L70 170 L75 165 L80 170 L85 165 L90 170 L95 165 L100 170 L105 165 L110 170 L115 165 L120 170 L125 165 L130 170 L135 165 L140 170 L145 165 L150 170 L155 165 L160 170 L165 165 L170 170 L175 165 L180 170"/>
  </g>
  
  <!-- Field boundaries/bunds -->
  <rect x="8" y="98" width="184" height="4" fill="#92400e"/>
  <rect x="8" y="178" width="184" height="4" fill="#92400e"/>
  
  <!-- Distant mountains -->
  <path d="M0 70 Q50 50 100 60 Q150 40 200 65 L200 95 L0 95 Z" fill="#64748b" opacity="0.4"/>
  
  <!-- Label -->
  <text x="100" y="195" text-anchor="middle" fill="#4a5568" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Large Rice Field</text>
</svg>
