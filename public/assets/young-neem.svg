<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Young Neem Tree -->
  <rect width="200" height="200" fill="#e0f2fe"/>
  
  <!-- Trunk -->
  <rect x="95" y="130" width="10" height="50" fill="#78350f" stroke="#65281c" stroke-width="1"/>
  
  <!-- Small Canopy -->
  <ellipse cx="100" cy="120" rx="35" ry="25" fill="#15803d" opacity="0.9"/>
  <ellipse cx="90" cy="110" rx="20" ry="15" fill="#16a34a" opacity="0.8"/>
  <ellipse cx="110" cy="115" rx="25" ry="18" fill="#16a34a" opacity="0.8"/>
  
  <!-- Small branches -->
  <path d="M95 135 L80 125" stroke="#78350f" stroke-width="2"/>
  <path d="M105 135 L120 125" stroke="#78350f" stroke-width="2"/>
  
  <!-- Ground -->
  <rect x="0" y="180" width="200" height="20" fill="#84cc16"/>
  
  <!-- Small leaves scattered -->
  <ellipse cx="75" cy="125" rx="8" ry="5" fill="#22c55e" opacity="0.7"/>
  <ellipse cx="125" cy="120" rx="10" ry="6" fill="#22c55e" opacity="0.7"/>
  
  <!-- Label -->
  <text x="100" y="195" text-anchor="middle" fill="#4a5568" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Young Neem Tree</text>
</svg>
