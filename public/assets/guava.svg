<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Small Guava -->
  <rect width="200" height="200" fill="#f8fafc"/>
  
  <!-- Guava Body - Small round -->
  <ellipse cx="100" cy="100" rx="25" ry="28" fill="#84cc16" stroke="#65a30d" stroke-width="2"/>
  
  <!-- Guava pattern -->
  <ellipse cx="100" cy="95" rx="20" ry="23" fill="#a3e635" opacity="0.7"/>
  <ellipse cx="100" cy="90" rx="15" ry="18" fill="#bef264" opacity="0.5"/>
  
  <!-- Small dots for seeds/texture -->
  <g fill="#65a30d" opacity="0.6">
    <circle cx="90" cy="90" r="1.5"/>
    <circle cx="110" cy="95" r="1.5"/>
    <circle cx="95" cy="105" r="1.5"/>
    <circle cx="105" cy="110" r="1.5"/>
    <circle cx="100" cy="100" r="1.5"/>
  </g>
  
  <!-- Small stem -->
  <rect x="98" y="72" width="4" height="8" fill="#78350f"/>
  
  <!-- Small leaves -->
  <ellipse cx="95" cy="75" rx="5" ry="3" fill="#22c55e" transform="rotate(-30 95 75)"/>
  <ellipse cx="105" cy="75" rx="5" ry="3" fill="#22c55e" transform="rotate(30 105 75)"/>
  
  <!-- Label -->
  <text x="100" y="180" text-anchor="middle" fill="#4a5568" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Small Guava</text>
</svg>
