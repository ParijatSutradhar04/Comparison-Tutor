<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Ant - very small -->
  <rect width="200" height="200" fill="#87CEEB"/>
  <!-- Magnified view indicator -->
  <circle cx="100" cy="100" r="80" stroke="#000" stroke-width="2" stroke-dasharray="5,5" fill="none" opacity="0.3"/>
  <text x="100" y="30" text-anchor="middle" fill="#000" font-size="10">(Magnified View)</text>
  
  <!-- Ant body parts -->
  <!-- Head -->
  <ellipse cx="85" cy="90" rx="8" ry="6" fill="#000"/>
  <!-- Thorax -->
  <ellipse cx="100" cy="100" rx="6" ry="8" fill="#000"/>
  <!-- Abdomen -->
  <ellipse cx="115" cy="110" rx="10" ry="12" fill="#000"/>
  
  <!-- Legs -->
  <line x1="95" y1="95" x2="88" y2="105" stroke="#000" stroke-width="1"/>
  <line x1="100" y1="95" x2="93" y2="110" stroke="#000" stroke-width="1"/>
  <line x1="105" y1="95" x2="98" y2="108" stroke="#000" stroke-width="1"/>
  <line x1="95" y1="105" x2="102" y2="115" stroke="#000" stroke-width="1"/>
  <line x1="100" y1="105" x2="107" y2="118" stroke="#000" stroke-width="1"/>
  <line x1="105" y1="105" x2="112" y2="115" stroke="#000" stroke-width="1"/>
  
  <!-- Antennae -->
  <line x1="80" y1="85" x2="75" y2="80" stroke="#000" stroke-width="1"/>
  <line x1="90" y1="85" x2="95" y2="80" stroke="#000" stroke-width="1"/>
  
  <text x="100" y="190" text-anchor="middle" fill="#000" font-size="12">Very Small Ant</text>
</svg>
