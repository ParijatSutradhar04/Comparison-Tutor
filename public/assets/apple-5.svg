<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="300" fill="#f0f9ff"/>
  <text x="150" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0369a1">5 Apples</text>
  
  <!-- Row 1: 3 apples -->
  <circle cx="80" cy="80" r="25" fill="#ef4444" opacity="0.9"/>
  <circle cx="150" cy="80" r="25" fill="#ef4444" opacity="0.9"/>
  <circle cx="220" cy="80" r="25" fill="#ef4444" opacity="0.9"/>
  
  <!-- Row 2: 2 apples -->
  <circle cx="115" cy="140" r="25" fill="#ef4444" opacity="0.9"/>
  <circle cx="185" cy="140" r="25" fill="#ef4444" opacity="0.9"/>
  
  <!-- Apple stems -->
  <line x1="80" y1="55" x2="80" y2="70" stroke="#22c55e" stroke-width="3"/>
  <line x1="150" y1="55" x2="150" y2="70" stroke="#22c55e" stroke-width="3"/>
  <line x1="220" y1="55" x2="220" y2="70" stroke="#22c55e" stroke-width="3"/>
  <line x1="115" y1="115" x2="115" y2="130" stroke="#22c55e" stroke-width="3"/>
  <line x1="185" y1="115" x2="185" y2="130" stroke="#22c55e" stroke-width="3"/>
  
  <!-- Highlight outline for 5 apples -->
  <rect x="10" y="10" width="280" height="280" fill="none" stroke="#22c55e" stroke-width="4" opacity="0.7" rx="15"/>
  
  <text x="150" y="220" text-anchor="middle" font-size="20" font-weight="bold" fill="#059669">5 Apples</text>
  <text x="150" y="250" text-anchor="middle" font-size="16" fill="#6b7280">Left Side - More Apples!</text>
</svg>
